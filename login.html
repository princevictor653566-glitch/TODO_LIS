<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <main id="login-container">
   
    <div id="brand">
      <div id="logo-icon-css">✓</div>
      <span id="brand-name">TASK<span class="brand-accent">FLOW</span></span>
    </div>

    <h1 id="title">Log in to your account</h1>

   
    <form id="login-form" onsubmit="event.preventDefault();">
      
      <div id="form-group">
        <label for="username">Email or Username</label>
        <input 
          type="text" 
          id="username" 
          placeholder="Enter Email or Username" 
          required
        >
      </div>

      
      <div id="form-group">
        <label for="password">Password</label>
        <div id="password-wrapper">
          <input 
            type="password" 
            id="password" 
            placeholder="Enter Password" 
            required
          >
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
            <i id="fa-regular fa-eye-slash" id="eyeIcon"></i>
          </button>
        </div>
      </div>

     
      <div id="forgot-wrapper">
        <a href="#" class="forgot-link">Forgot Password?</a>
      </div>

      
      <!-- <button type="submit" class="submit-btn">Log In</button> -->

      
      <p id="signup-text">
        Don’t have an account? <a href="signup.html" class="signup-link">Sign up</a>
      </p>

    </form>
  </main>
  <script src="fuction.js"></script>
</body>
</html>
